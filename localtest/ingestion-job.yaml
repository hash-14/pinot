# Segment creation only (no push): CSV in deepstore/demo/raw -> tarballs in deepstore/demo/segments.
# make-demo-data.sh then untars them into deepstore/remote/<table>/<segment>/v3/ (what the fork
# range-reads) and setup-table.sh uploads the tarballs to the controller for Helix assignment.
executionFrameworkSpec:
  name: standalone
  segmentGenerationJobRunnerClassName: org.apache.pinot.plugin.ingestion.batch.standalone.SegmentGenerationJobRunner
jobType: SegmentCreation
inputDirURI: 'file:///deepstore/demo/raw/'
includeFileNamePattern: 'glob:**/*.csv'
outputDirURI: 'file:///deepstore/demo/segments/'
overwriteOutput: true
pinotFSSpecs:
  - scheme: file
    className: org.apache.pinot.spi.filesystem.LocalPinotFS
recordReaderSpec:
  dataFormat: csv
  className: org.apache.pinot.plugin.inputformat.csv.CSVRecordReader
tableSpec:
  tableName: streams_daily
  schemaURI: 'file:///conf/schema.json'
  tableConfigURI: 'file:///conf/table.json'
segmentNameGeneratorSpec:
  type: inputFile
  configs:
    file.path.pattern: '.+/(.+)\.csv'
    # \$ because the job spec is itself a Groovy template (LaunchDataIngestionJob renders it first)
    segment.name.template: 'streams_daily_\${filePathPattern:\1}'
